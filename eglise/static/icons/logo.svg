<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5e72e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#825ee4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Church Building -->
  <g fill="white" opacity="0.95">
    <!-- Main Building Base -->
    <rect x="60" y="85" width="80" height="70" rx="4"/>
    
    <!-- Door -->
    <rect x="90" y="110" width="20" height="45" fill="#5e72e4" opacity="0.7"/>
    <circle cx="108" cy="132" r="2" fill="white"/>
    
    <!-- Left Window -->
    <rect x="70" y="95" width="12" height="12" fill="#5e72e4" opacity="0.6"/>
    <line x1="76" y1="95" x2="76" y2="107" stroke="#825ee4" stroke-width="1"/>
    <line x1="70" y1="101" x2="82" y2="101" stroke="#825ee4" stroke-width="1"/>
    
    <!-- Right Window -->
    <rect x="118" y="95" width="12" height="12" fill="#5e72e4" opacity="0.6"/>
    <line x1="124" y1="95" x2="124" y2="107" stroke="#825ee4" stroke-width="1"/>
    <line x1="118" y1="101" x2="130" y2="101" stroke="#825ee4" stroke-width="1"/>
    
    <!-- Roof Peak -->
    <polygon points="100,55 60,85 140,85" fill="white" opacity="0.9"/>
    
    <!-- Roof Details -->
    <line x1="100" y1="55" x2="80" y2="80" stroke="#5e72e4" stroke-width="1.5" opacity="0.4"/>
    <line x1="100" y1="55" x2="120" y2="80" stroke="#5e72e4" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Cross on Top -->
    <rect x="97" y="35" width="6" height="25" fill="#825ee4"/>
    <rect x="88" y="48" width="24" height="6" fill="#825ee4"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>
