<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5e72e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#825ee4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Church Building - Enhanced visibility -->
  <g fill="white">
    <!-- Main Building Base -->
    <rect x="60" y="85" width="80" height="70" rx="4" fill="white" stroke="none"/>
    
    <!-- Door -->
    <rect x="90" y="110" width="20" height="45" fill="#3f51b5" stroke="none"/>
    <circle cx="108" cy="132" r="2" fill="white"/>
    
    <!-- Left Window -->
    <rect x="70" y="95" width="12" height="12" fill="#3f51b5" stroke="none"/>
    <line x1="76" y1="95" x2="76" y2="107" stroke="#1a237e" stroke-width="1"/>
    <line x1="70" y1="101" x2="82" y2="101" stroke="#1a237e" stroke-width="1"/>
    
    <!-- Right Window -->
    <rect x="118" y="95" width="12" height="12" fill="#3f51b5" stroke="none"/>
    <line x1="124" y1="95" x2="124" y2="107" stroke="#1a237e" stroke-width="1"/>
    <line x1="118" y1="101" x2="130" y2="101" stroke="#1a237e" stroke-width="1"/>
    
    <!-- Roof Peak -->
    <polygon points="100,55 60,85 140,85" fill="white" stroke="none"/>
    
    <!-- Cross on Top - Bright White -->
    <rect x="97" y="35" width="6" height="25" fill="white" stroke="none"/>
    <rect x="88" y="48" width="24" height="6" fill="white" stroke="none"/>
  </g>
  
  <!-- Optional: Add inner circle border for definition -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
</svg>
